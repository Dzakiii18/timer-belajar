<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Belajar</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            padding: 20px;
            background-image: url('ChatGPT Image Apr 30, 2025, 11_00_16 AM.png');
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        /* Jam Weker (Atas) */
        .alarm-clock-container {
            margin-bottom: 30px;
        }
        
        .alarm-clock-image {
            width: 200px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Digital Clock */
        .digital-clock {
            font-family: 'Courier New', monospace;
            font-size: 36px;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        /* Timer (Bawah) */
        .timer-controls {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        
        .timer-display {
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .timer-input {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .timer-input input {
            width: 60px;
            height: 40px;
            text-align: center;
            font-size: 24px;
            margin: 0 5px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        
        .timer-input span {
            font-size: 24px;
            line-height: 40px;
        }
        
        button {
            background-color: #4a90e2;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 0 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #3a7bc8;
        }
        
        .settings-toggle {
            background-color: #6c757d;
            margin-top: 20px;
        }
        
        .settings-toggle:hover {
            background-color: #5a6268;
        }
        
        .settings-panel {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .settings-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .file-input-label {
            display: inline-block;
            padding: 8px 15px;
            background-color: #3d6088;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
        }
        
        .file-input-label:hover {
            background-color: #3a7bc8;
        }
        
        .file-input {
            display: none;
        }
        
        .hidden {
            display: none;
        }
        
        /* Responsivitas */
        @media (max-width: 480px) {
            .timer-display {
                font-size: 32px;
            }
            
            .timer-input input {
                width: 50px;
                height: 35px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Timer Belajar</h1>
        
        <!-- Jam Weker (Atas) -->
        <div class="alarm-clock-container">
            <img src="ChatGPT Image Apr 30, 2025, 11_00_13 AM.png" alt="Jam Weker" id="alarm-clock-image" class="alarm-clock-image">
        </div>
        
        <!-- Digital Clock -->
        <div class="digital-clock" id="digital-clock">00:00:00</div>
        
        <!-- Timer (Bawah) -->
        <div class="timer-controls">
            <div class="timer-display" id="timer-display">00:00:00</div>
            
            <div class="timer-input">
                <input type="number" id="hours" min="0" max="23" value="0">
                <span>:</span>
                <input type="number" id="minutes" min="0" max="59" value="25">
                <span>:</span>
                <input type="number" id="seconds" min="0" max="59" value="0">
            </div>
            
            <div>
                <button id="start-btn">Mulai</button>
                <button id="pause-btn">Jeda</button>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
        
        <div class="settings-panel hidden" id="settings-panel">
            <div class="settings-title">Ubah Tampilan</div>
            
            <div>
                <label class="file-input-label">
                    Pilih Gambar Jam Weker
                    <input type="file" id="alarm-clock-input" class="file-input" accept="image/*">
                </label>
                
                <label class="file-input-label">
                    Pilih Background
                    <input type="file" id="bg-input" class="file-input" accept="image/*">
                </label>
            </div>
            
            <div style="margin-top: 10px;">
                <button id="reset-settings">Reset Tampilan</button>
            </div>
        </div>
    </div>
    
    <audio id="alarm-sound" preload="auto">
        <source src="BIKIN NANGIS! Prince Poetiray & Quinn Salman 'Selalu Ada di Nadimu' OST. Film JUMBO (1).mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Timer functionality
        let timerInterval;
        let totalSeconds = 0;
        let isRunning = false;
        const alarmSound = document.getElementById('alarm-sound');
        
        // Update digital clock
        function updateDigitalClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        function startTimer() {
            if (isRunning) return;
            
            if (totalSeconds === 0) {
                // Get time from inputs
                const hours = parseInt(document.getElementById('hours').value) || 0;
                const minutes = parseInt(document.getElementById('minutes').value) || 0;
                const seconds = parseInt(document.getElementById('seconds').value) || 0;
                
                totalSeconds = hours * 3600 + minutes * 60 + seconds;
                
                if (totalSeconds === 0) return;
            }
            
            isRunning = true;
            
            timerInterval = setInterval(() => {
                totalSeconds--;
                updateTimerDisplay();
                
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    playAlarm();
                }
            }, 1000);
        }
        
        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalSeconds = 0;
            updateTimerDisplay();
            alarmSound.pause();
            alarmSound.currentTime = 0;
        }
        
        function updateTimerDisplay() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            document.getElementById('timer-display').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function playAlarm() {
            alarmSound.play().catch((error) => {
                console.log("Audio playback failed:", error);
            });
            // Loop the alarm sound until user interaction
            alarmSound.loop = true;
        }
        
        // Handle file input for background image
        function handleBackgroundImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        }
        
        // Handle file input for alarm clock image
        function handleAlarmClockImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('alarm-clock-image').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        
        // Reset all customizations
        function resetCustomizations() {
            document.body.style.backgroundImage = '';
            document.body.style.backgroundColor = '#f0f8ff';
            document.getElementById('alarm-clock-image').src = 'ChatGPT Image Apr 30, 2025, 11_00_13 AM.png';
        }
        
        // Toggle settings panel
        function toggleSettings() {
            const settingsPanel = document.getElementById('settings-panel');
            settingsPanel.classList.toggle('hidden');
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Update digital clock every second
            setInterval(updateDigitalClock, 1000);
            
            // Initial updates
            updateDigitalClock();
            updateTimerDisplay();
            
            // Event listeners for timer
            document.getElementById('start-btn').addEventListener('click', startTimer);
            document.getElementById('pause-btn').addEventListener('click', pauseTimer);
            document.getElementById('reset-btn').addEventListener('click', resetTimer);
            
            // Event listeners for customization
            document.getElementById('bg-input').addEventListener('change', handleBackgroundImage);
            document.getElementById('alarm-clock-input').addEventListener('change', handleAlarmClockImage);
            document.getElementById('settings-toggle').addEventListener('click', toggleSettings);
            document.getElementById('reset-settings').addEventListener('click', resetCustomizations);
            
            // Allow user to stop alarm by clicking anywhere
            document.body.addEventListener('click', () => {
                if (totalSeconds <= 0 && !isRunning) {
                    alarmSound.pause();
                    alarmSound.currentTime = 0;
                    alarmSound.loop = false;
                }
            });
        });
    </script>
</body>
</html>
